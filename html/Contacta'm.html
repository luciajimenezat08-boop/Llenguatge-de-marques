<!DOCTYPE html>

<html>

    <header>
        <P>CONTACTA'M</P>

    <body>

        <h1>Contacta'm</h1>

        <form>

            <label for="nom">Nom:</label>
            <input type="text" id="nom" name="nom" placeholder="Escriu el teu nom">

            <br><br>

            <label for="correu">Correu electrònic:</label>
            <input type="email" id="correu" name="correu" placeholder="Escriu el teu correu electrònic">

            <br><br>

            <label for="missatge">Missatge:</label>
            <br>
            <textarea id="missatge" name="missatge" placeholder="Escriu el teu missatge"></textarea>

            <br><br>

            <input type="submit" value="Enviar">

        </form>

    </body>
</html>
